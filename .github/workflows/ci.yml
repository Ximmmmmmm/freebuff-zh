# 词典与工具链质量门禁。
# 只跑不依赖专有产物（app.asar / ui 资源）的检查，完整构建仍在本地进行。
# 其中 snapshot-gates 跑的是 release.sh 的那四道发布闸门（同名、同判据），只是「本版产物」
# 改用「快照 + 词典 + 补丁」在前置步骤重建——漏翻 / 单词级英文 / 字面量占用在 PR 阶段就能拦下。
# 版本刚 bump、本版原版还没发布时它退到「近似模式」：拿上一版快照当替身，闸一 / 闸二 / 闸三
# 只列差异清单（不作判定），闸四与镜像重建仍硬拦；本版新增的英文文案在这里看不到，由发布前的
# release.sh 四道闸门（真实产物）把关——细节见 tools/ci_gates.sh 的文件头。
#
# 两个 job 都在 ubuntu-latest + windows-latest 上各跑一遍（矩阵）：
#   · 仓库对行尾敏感（脚本与词典强制 LF、补丁 -text 原样、ci.yml 自身是 CRLF），工具又大量读写
#     路径与临时目录——只在 Linux 上验证，等于把 Windows 上的 shell 差异、路径分隔符、checkout
#     行尾转换这些事留到「有人本地跑」那一刻才暴露；
#   · Windows 上默认 shell 是 pwsh，凡是含 bash 语法的步骤都显式写了 shell: bash；
#   · 另有只在 Windows 上跑的一道行尾守卫：checkout 若把脚本 / 补丁 / 词典换成 CRLF 直接报错。
# 两个 job 都用 fail-fast: false：一个 OS 红了，也能看到另一个的结论。
name: lint

on:
  push:
    paths: ['dict.json', 'manifest.json', 'intentional-english.json', 'patches/**', 'tools/**', '*.sh', '.github/workflows/**']
  pull_request:
    paths: ['dict.json', 'manifest.json', 'intentional-english.json', 'patches/**', 'tools/**', '*.sh', '.github/workflows/**']
  workflow_dispatch:

jobs:
  dict-lint:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: 词典 lint（结构 / 重复键 / 占位符一致性 / 半截模板键）
        run: node tools/lint_dict.js
      - name: remap 自测（模板变量迁移 + 半截模板 + lint 负面用例）
        run: node tools/test_remap.js
      - name: 模板骨架底层自测（解析 / 骨架 / 标识符改名 / 三种捕获形态；remap 与 resituate 共用一份）
        run: node tools/test_literal_skeleton.js
      - name: blindscan 自测（原版 vs 产物的英文片段对差）
        run: node tools/test_blindscan.js
      - name: uipos 自测（锚点必须是属性名：字符串内容 / 属性读取两类误报）
        run: node tools/test_uipos.js
      - name: mainscan 自测（主进程对差：注释 / 模板插值 / 正则 / 保留名单 / 退出码）
        run: node tools/test_mainscan.js
      - name: forbidden 体检自测（asar 读取 / 补丁形态 / 判定表与容差 / 退出码 0-1-2）
        run: node tools/test_forbidden_probe.js
      - name: upstreamdiff 自测（上游两版原版对差：插值改名 / 分桶 / 改写配对 / --auto / 登记表与 --no-allow）
        run: node tools/test_upstreamdiff.js
      - name: pristine 自测（原版快照：采集 / 校验 / 导出导入往返 / 损坏与冲突 / 退出码）
        run: node tools/test_pristine.js
      - name: dictapply 自测（变更清单：四类定位 / 整体拒绝 / rename 保序 / lint 闸门还原 / emit 解析）
        run: node tools/test_dictapply.js
      - name: fastloop 自测（快验循环：复合键拆解 / 四种转义形态 / lint 归因优先 / 缺原版必须拒）
        run: node tools/test_fastloop.js
      - name: auto_translate 自测（智能清单预填：术语对齐 / G1代码保护 / 占位符不变式）
        run: node tools/test_auto_translate.js
      - name: UI 行为补丁自测（改名抗性 / 唯一命中 / 幂等）
        run: node tools/test_ui_code_patch.js
      - name: 语义守卫自测（正则字面量不假阳性 / 真语义位置仍拦下）
        run: node tools/test_semantic_guard.js
      - name: 注释分词器自测（正则 / 模板 / 字符串里的 // 不产生假注释；真注释区不翻、假注释区仍翻）
        run: node tools/test_comment_scan.js
      - name: 行为取证探针自测（拿不到证据必须 rc 2，不冒充判决）
        shell: bash
        run: |
          node tools/test_probe_stream_epoch.js
          node tools/test_probe_token_epoch.js
          node tools/test_probe_shell_colors.js
      - name: 退场判定自测（决策表 / 退出码契约 / 删除清单完整性）
        run: node tools/test_ui_patch_status.js
      - name: 词条命中体检自测（只在主进程 / 只在上版 / 哪都没有 / 退出码）
        run: node tools/test_missed_diagnose.js
      - name: 旧词条重新定位自测（模板 / 代码片段 / 字面量三路定位 + 写回自证 + 退出码）
        run: node tools/test_resituate.js
      - name: 回归闸门自测（登记表逐条豁免 / 未登记仍拦 / --allow-english / 退出码）
        run: node tools/test_regress.js
      - name: 单词级界面文案差集自测（解析口径 / 两侧差集 / 登记表 / 退出码）
        run: node tools/test_uipos_gap.js
      - name: 字面量占用自测（路径 / 比较 / IPC 三形态与假阳性防线）
        run: node tools/test_lint_collisions.js
      - name: 补丁预检自测（行号漂移 vs 上游改写的分诊 / 重锚定幂等 / 镜像口径）
        run: node tools/test_patch_preflight.js
      - name: 补丁重生成自测（映射提取 / 镜像口径 / 上游插行端到端 / 失败不写盘）
        run: node tools/test_regen_patch.js
      - name: CI 闸门自测（假绿灯防线 / 跳过路径 / 退出码）
        run: node tools/test_ci_gates.js
      - name: 接线守卫自测（漏接线 / 悬空引用 / 注释不算接线 / 重复与 if 门 / 退出码）
        run: node tools/test_ci_wiring.js
      - name: 构建复用自测（输入变更 / 产物篡改 / 缺构建记录 / 退出码 / 真仓库布局）
        run: node tools/test_build_key.js
      - name: 行尾守卫（Windows 上 checkout 不得把脚本 / 补丁 / 词典 / 文档换成 CRLF）
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          # 补丁是 -text（字节敏感）、脚本与词典是 eol=lf：这几类在 Windows 上必须是 LF，
          # 否则本地对、CI 上对不上（典型症状是补丁上下文行带 CR 后 git apply 拒绝）。
          bad="$(git ls-files --eol -- '*.js' '*.sh' '*.patch' '*.json' '*.md' | awk '$2 == "w/crlf" { print $NF }')"
          if [ -n "$bad" ]; then
            echo "::error::以下文件被 checkout 成了 CRLF，而仓库要求 LF："
            printf '%s\n' "$bad"
            exit 1
          fi
          echo "行尾守卫：脚本 / 补丁 / 词典 / 文档全部为 LF ✓"
      - name: 工具脚本语法冒烟
        shell: bash
        run: |
          for f in tools/*.js; do
            node --check "$f"
          done
      - name: Shell 脚本语法冒烟
        shell: bash
        run: |
          for f in *.sh tools/*.sh; do
            bash -n "$f"
          done
      - name: 接线守卫（tools/test_*.js 与 workflow 里真的跑到的那批必须一一对应）
        run: node tools/ci_wiring.js

  # 四道发布闸门单独一个 job：它们要一份「本版英文原版快照」（Release 资产 pristine-<版本>.json.gz）
  # 与一份「上一版已发布包」，而上面那批自测全用合成夹具、不碰网络——分开跑，网络抖动就不会
  # 把纯自测带红。
  snapshot-gates:
    # 同样两个 OS 都跑：这四道闸门是 bash + node + git apply 拼起来的，正是最容易踩平台差异的地方
    # （补丁上下文行尾、临时目录、cp -R 语义）。代价是每个 Release 资产被下载两遍，值这个价。
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # 快照、替身与上一版包的取回都在脚本内部（pristine.js import --from-release / Release 资产
      # 下载），不单列步骤：本版原版拿不到时脚本自己退到近似模式（上一版快照当替身），连替身都
      # 拿不到才打 ::warning:: 并 rc 0——单列一步会让那两种情况直接把 job 打红。
      - name: 四道发布闸门（主进程漏翻 / 回归 / 单词级文案 / 字面量占用）+ 补丁锚点预检
        env:
          # 只为不吃共享出口 IP 的匿名 API 限额；仓库公开，没它也基本能用。
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: bash tools/ci_gates.sh
