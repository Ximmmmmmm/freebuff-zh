# 词典与工具链质量门禁。
# 只跑不依赖专有产物（app.asar / ui 资源）的检查，完整构建仍在本地进行。
name: lint

on:
  push:
    paths: ['dict.json', 'lang-pref.md', 'tools/**', '*.sh', '.github/workflows/**']
  pull_request:
    paths: ['dict.json', 'lang-pref.md', 'tools/**', '*.sh', '.github/workflows/**']
  workflow_dispatch:

jobs:
  dict-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 词典 lint（结构 / 重复键 / 占位符一致性）
        run: node tools/lint_dict.js
      - name: 工具脚本语法冒烟
        run: |
          for f in tools/*.js; do
            node --check "$f"
          done
      - name: Shell 脚本语法冒烟
        run: |
          for f in *.sh tools/*.sh; do
            bash -n "$f"
          done
      - name: 语言偏好写入回归测试（沙箱 HOME）
        run: bash tools/test_lang_pref.sh

  # ~/.AGENTS.md 的写入最终跑在 Windows Git Bash 上，而 CRLF 处理正是只在
  # 该平台暴露过的坑（awk 会吞掉 \r），ubuntu 覆盖不到，故单独跑一轮。
  lang-pref-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: 语言偏好写入回归测试（Git Bash）
        shell: bash
        run: bash tools/test_lang_pref.sh
